version: "3.8"
services:
  #MySQL
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: aqimcmp5
      MYSQL_DATABASE: bankingsys
    ports:
      - "3307:3306"
    networks:
      - banking-network
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-paqimcmp5", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  #Backend & GlassFish
  backend:
    build: .
    ports:
      - "8080:8080"
      - "4848:4848"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - banking-network
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - PAYHERE_MERCHANT_ID=${PAYHERE_MERCHANT_ID}
      - PAYHERE_MERCHANT_SECRET=${PAYHERE_MERCHANT_SECRET}

  #Frontend
  frontend:
    build: ./banking-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - banking-network
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

networks:
  banking-network:
    driver: bridge

volumes:
  db_data: