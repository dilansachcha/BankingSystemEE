<div class="login-wrapper">
  <mat-card class="glass-card">

    <div class="logo-container">
      <img src="bankingsyslogo.png" alt="Fortress Banking Logo" class="brand-logo">
    </div>

    <h2 class="welcome-text">Welcome Back!</h2>
    <p class="subtitle">Don't have an account yet? <a href="#" class="accent-link">Sign up</a></p>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()">

        <div class="error-msg" *ngIf="errorMessage">
          <mat-icon>error_outline</mat-icon> {{ errorMessage }}
        </div>

        <mat-form-field appearance="outline" class="dark-input full-width">
          <mat-label>Email address</mat-label>
          <mat-icon matPrefix>mail_outline</mat-icon>
          <input matInput type="email" name="email" [(ngModel)]="email" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="dark-input full-width">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix>lock_outline</mat-icon>
          <input matInput [type]="hidePassword ? 'password' : 'text'" name="password" [(ngModel)]="password" required>
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <div class="forgot-pwd">
          <a href="#" class="accent-link">Forgot Password?</a>
        </div>

        <button mat-flat-button type="submit" class="neon-btn full-width" [disabled]="!email || !password">
          Login
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
