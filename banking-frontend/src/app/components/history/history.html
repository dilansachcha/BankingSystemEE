<div class="page-container">
  <mat-card class="history-card">
    <mat-card-header>
      <mat-card-title>Transaction History</mat-card-title>

      <div class="header-actions">
        <button mat-raised-button color="primary" class="download-btn" (click)="downloadPDF()" [disabled]="transactions.length === 0 || isLoading">
          <mat-icon>picture_as_pdf</mat-icon> Download PDF
        </button>
        <button mat-button routerLink="/dashboard" class="back-btn">Back to Dashboard</button>
      </div>
    </mat-card-header>

    <div *ngIf="isLoading" class="spinner-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</div>

    <mat-card-content *ngIf="!isLoading && !errorMessage">
      <table mat-table [dataSource]="transactions" class="mat-elevation-z8 dark-table">

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef> Date & Time </th>
          <td mat-cell *matCellDef="let element"> {{ element.date | date:'medium' }} </td>
        </ng-container>

        <ng-container matColumnDef="accountNumber">
          <th mat-header-cell *matHeaderCellDef> Account </th>
          <td mat-cell *matCellDef="let element" class="mono"> {{ element.accountNumber }} </td>
        </ng-container>

        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef> Type </th>
          <td mat-cell *matCellDef="let element">
            <span class="type-badge" [ngClass]="element.type.toLowerCase()">{{ element.type }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef> Description </th>
          <td mat-cell *matCellDef="let element"> {{ element.description }} </td>
        </ng-container>

        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef class="right-align"> Amount </th>
          <td mat-cell *matCellDef="let element" class="right-align amount-cell" [ngClass]="element.type.toLowerCase()">
            {{ element.type === 'DEBIT' ? '-' : '+' }} LKR {{ element.amount | number:'1.2-2' }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div *ngIf="transactions.length === 0" class="no-data">
        No transactions found.
      </div>
    </mat-card-content>
  </mat-card>
</div>
