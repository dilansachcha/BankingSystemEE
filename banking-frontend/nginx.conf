server {
    listen 80;
    server_name fortressbank.dedyn.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    #HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fortressbank.dedyn.io;

    ssl_certificate /etc/letsencrypt/live/fortressbank.dedyn.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortressbank.dedyn.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    #Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    #Backend
    location /BankingSystemEE-1.0-SNAPSHOT/ {
        proxy_pass http://backend:8080/BankingSystemEE-1.0-SNAPSHOT/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}
